services:
  trackcubed-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: trackcubed-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TrackCubed_dev123!"
      MSSQL_PID: "Developer"
    ports:
      - "14333:1433"
    volumes:
      - trackcubed-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TrackCubed_dev123! -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  trackcubed-sql-data:
